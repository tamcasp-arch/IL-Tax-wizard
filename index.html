<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>אשף הדוח השנתי</title>
<meta name="theme-color" content="#0D5C63">
<meta name="description" content="אשף לחישוב החזר מס שנתי לשכירים בישראל">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="vendor/fonts/fonts.css">
<script src="vendor/pdf.min.js"></script>
<script src="runtime.js?v=1.0.6-beta"></script>
<style>
:root{
  --bg:#EEF2F1; --surface:#FFFFFF; --sunk:#F5F7F6; --ink:#16252B; --muted:#56666C; --line:#CFD8D6;
  --accent:#0D5C63; --accent-ink:#FFFFFF; --accent-soft:#DCEBEA; --good:#1E7A46; --good-soft:#E1F1E7;
  --warn:#9A5B00; --warn-soft:#FBF0DA; --bad:#A3312A; --bad-soft:#F8E3E1; --stamp:#0D5C63;
  --serif:"Frank Ruhl Libre", "David", "Times New Roman", serif;
  --sans:"Assistant", "Segoe UI", "Arial Hebrew", Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1719; --surface:#172225; --sunk:#1D2A2E; --ink:#E4ECEA; --muted:#9AAEB0; --line:#2F3F43;
    --accent:#5FB7B9; --accent-ink:#0B1A1C; --accent-soft:#1E3A3C; --good:#6FCF95; --good-soft:#18352A;
    --warn:#E8B04B; --warn-soft:#3A2E16; --bad:#F08A80; --bad-soft:#3D1F1C; --stamp:#5FB7B9;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1719; --surface:#172225; --sunk:#1D2A2E; --ink:#E4ECEA; --muted:#9AAEB0; --line:#2F3F43;
  --accent:#5FB7B9; --accent-ink:#0B1A1C; --accent-soft:#1E3A3C; --good:#6FCF95; --good-soft:#18352A;
  --warn:#E8B04B; --warn-soft:#3A2E16; --bad:#F08A80; --bad-soft:#3D1F1C; --stamp:#5FB7B9;
  color-scheme: dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
img{max-width:100%}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}

.shell{max-width:1180px;margin:0 auto;padding:28px 20px 120px}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
header.top h1{font-family:var(--serif);font-weight:700;font-size:clamp(28px,4vw,40px);line-height:1.1;margin:0}
header.top p{margin:6px 0 0;color:var(--muted);max-width:60ch}
.sync{font-size:13.5px;font-weight:600;color:var(--muted);padding-inline-start:16px;position:relative}.sync::before{content:"";position:absolute;inset-inline-start:2px;top:50%;width:8px;height:8px;margin-top:-4px;border-radius:50%;background:var(--muted)}.sync.good::before{background:var(--good)}.sync.warn::before{background:var(--warn)}.sync.bad::before{background:var(--bad)}
.yearpill{font-family:var(--serif);font-size:20px;border:2px solid var(--stamp);color:var(--stamp);padding:4px 14px;border-radius:999px;white-space:nowrap}

/* step rail: a real sequence */
.rail{display:flex;gap:0;margin:0 0 22px;padding:0;list-style:none;overflow-x:auto;border-bottom:1px solid var(--line)}
.rail li{flex:1 0 auto}
.rail button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:10px 14px 12px;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.rail button .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;border:1.5px solid currentColor;font-size:14px;font-weight:700}
.rail button[aria-current="step"]{color:var(--ink);border-bottom-color:var(--accent)}
.rail button[aria-current="step"] .n{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.rail button.done .n{background:var(--accent-soft);border-color:var(--accent-soft);color:var(--accent)}
.rail button:focus-visible{outline:3px solid var(--accent)}

.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:28px;align-items:start}
@media (max-width:960px){.layout{grid-template-columns:1fr}}

main h2{font-family:var(--serif);font-weight:700;font-size:28px;margin:0 0 4px}
main .lede{color:var(--muted);margin:0 0 20px;max-width:68ch}
.block{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px 22px;margin-bottom:16px}
.block h3{margin:0 0 4px;font-size:19px;font-weight:700}
.block .hint{color:var(--muted);font-size:15px;margin:0 0 14px;max-width:70ch}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px 18px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:15px;font-weight:600}
label.f small{font-weight:400;color:var(--muted)}
input[type=text],input[type=number],input[type=month],input[type=date],select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%}
input[type=number]{direction:ltr;text-align:right}
textarea{min-height:90px;resize:vertical}
.check{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.check:first-of-type{border-top:0}
.check input{margin-top:5px;width:18px;height:18px;accent-color:var(--accent);flex:none}
.check b{font-weight:600}
.check span small{display:block;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex-wrap:wrap}
.seg label{padding:8px 14px;cursor:pointer;font-weight:600;font-size:15px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--accent);color:var(--accent-ink)}
.seg label:has(input:focus-visible){outline:3px solid var(--accent);outline-offset:-3px}

.btn{font:inherit;font-weight:700;font-size:16px;border-radius:10px;padding:10px 18px;border:1.5px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.small{padding:6px 12px;font-size:14px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.nav{display:flex;justify-content:space-between;gap:12px;margin-top:20px}

.note{border-radius:10px;padding:12px 14px;margin:12px 0;font-size:15px;border:1px solid}
.note.warn{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 35%,transparent);color:var(--ink)}
.note.bad{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 35%,transparent)}
.note.good{background:var(--good-soft);border-color:color-mix(in srgb,var(--good) 35%,transparent)}
.note.info{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 30%,transparent)}
.note b{font-weight:700}

/* upload */
.drop{border:2px dashed var(--line);border-radius:14px;padding:26px;text-align:center;background:var(--sunk);cursor:pointer;transition:border-color .15s}
.drop.over{border-color:var(--accent)}
.drop strong{display:block;font-size:18px}
.drop span{color:var(--muted);font-size:15px}
.doc{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-top:12px;background:var(--surface)}
.doc-h{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.doc-h .t{font-weight:700}
.tag{font-size:13px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.bad{background:var(--bad-soft);color:var(--bad)}
.tag.good{background:var(--good-soft);color:var(--good)}
.doc .grid{margin-top:12px}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;vertical-align:-2px;margin-inline-start:6px}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spinner{animation:none}}

.kids{display:flex;flex-direction:column;gap:8px}
.kid{display:flex;gap:10px;align-items:end}
.kid label{flex:1}

/* the ledger: a running form-style tally, the page's one bold element */
aside.ledger{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.ledger .lh{padding:16px 18px 10px;border-bottom:2px solid var(--ink)}
.ledger .lh h2{font-family:var(--serif);font-size:20px;margin:0}
.ledger .lh p{margin:2px 0 0;color:var(--muted);font-size:14px}
.ledger table{width:100%;border-collapse:collapse;font-size:15px}
.ledger td{padding:7px 18px;border-bottom:1px dashed var(--line)}
.ledger td:last-child{text-align:left}
.ledger tr.sub td{color:var(--muted);font-size:13.5px;padding-top:3px;padding-bottom:3px}
.ledger .who{background:var(--sunk);font-weight:700;font-size:14px;border-bottom:1px solid var(--line)}
.ledger .total{padding:16px 18px 18px;border-top:2px solid var(--ink)}
.ledger .total .lbl{font-weight:700}
.ledger .total .big{font-family:var(--serif);font-size:38px;line-height:1.1;font-weight:700}
.ledger .total .big.pos{color:var(--good)} .ledger .total .big.neg{color:var(--bad)}
.ledger .total .range{color:var(--muted);font-size:14px}
.ledger .foot{padding:10px 18px 14px;font-size:13px;color:var(--muted);border-top:1px solid var(--line)}
@media (max-width:960px){
  aside.ledger{position:fixed;inset:auto 0 0 0;top:auto;border-radius:14px 14px 0 0;z-index:20;padding-bottom:env(safe-area-inset-bottom,0px);max-height:70vh;overflow:auto}
  aside.ledger:not(.open) table, aside.ledger:not(.open) .foot, aside.ledger:not(.open) .lh{display:none}
  aside.ledger .total{border-top:0;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 18px}
  aside.ledger .total .big{font-size:28px}
}
.ledger-toggle{display:none}
@media (max-width:960px){.ledger-toggle{display:inline-block}}

/* results */
.result-head{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-bottom:16px}
.figure{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.figure .k{color:var(--muted);font-size:14px}
.figure .v{font-family:var(--serif);font-size:30px;font-weight:700}
table.calc{width:100%;border-collapse:collapse;font-size:15.5px}
table.calc th,table.calc td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top}
table.calc th{font-weight:700;background:var(--sunk)}
table.calc td.n{text-align:left;white-space:nowrap}
table.calc tr.sum td{font-weight:700;border-top:2px solid var(--ink)}
.scroll-x{overflow-x:auto}
ul.plain{margin:0;padding-inline-start:20px}
ul.plain li{margin:6px 0}
.ai-out{white-space:pre-wrap;background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:14px;margin-top:12px;min-height:48px}
.sources a{display:block;margin:4px 0}
.legal{font-size:13.5px;color:var(--muted);margin-top:22px;max-width:80ch}
.hidden{display:none !important}
/* review dialog */
dialog#review{border:0;padding:0;border-radius:16px;width:min(1100px,96vw);max-height:92vh;background:var(--surface);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog#review::backdrop{background:rgba(10,20,22,.55)}
.rv{display:flex;flex-direction:column;max-height:92vh}
.rv-h{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 20px;border-bottom:2px solid var(--ink)}
.rv-h h2{font-family:var(--serif);font-size:22px;margin:0}
.rv-h p{margin:2px 0 0;color:var(--muted);font-size:14px}
.rv-b{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:0;overflow:hidden;flex:1;min-height:0}
@media (max-width:820px){.rv-b{grid-template-columns:1fr;overflow:auto}.rv-src{max-height:42vh}}
.rv-src{background:var(--sunk);border-inline-end:1px solid var(--line);overflow:auto;padding:12px}
.rv-src img{display:block;width:100%;margin:0 auto 10px;border:1px solid var(--line);background:#fff;cursor:zoom-in}
.rv-src.zoom img{width:200%;max-width:none;cursor:zoom-out}
.rv-src pre{white-space:pre-wrap;font-size:13px;margin:0;direction:rtl}
.rv-src mark{background:color-mix(in srgb,var(--warn) 35%,transparent);color:inherit}
.rv-f{overflow:auto;padding:14px 18px}
.rv-meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px 14px;margin-bottom:12px}
.rv-checks{margin:0 0 12px;padding:0;list-style:none}
.rv-checks li{padding:8px 12px;border-radius:8px;margin-bottom:6px;font-size:14.5px;border:1px solid}
.rv-checks li.error{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.rv-checks li.warn{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
.rv-checks li.info{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 30%,transparent)}
.rv-row{display:grid;grid-template-columns:auto minmax(0,1fr) 150px;gap:10px;align-items:start;padding:10px 0;border-top:1px solid var(--line)}
.rv-row.err{background:linear-gradient(90deg,transparent,var(--bad-soft))}
.rv-row .ok{width:20px;height:20px;margin-top:4px;accent-color:var(--good)}
.rv-row .lbl{font-weight:700;font-size:15px}
.rv-row .lbl small{display:block;font-weight:400;color:var(--muted)}
.rv-row .ev{font-size:13px;color:var(--muted);margin-top:3px}
.rv-row .ev q{quotes:"״" "״"}
.rv-row .st{font-size:12.5px;font-weight:700;margin-top:4px}
.rv-row .st.good{color:var(--good)}.rv-row .st.warn{color:var(--warn)}.rv-row .st.bad{color:var(--bad)}
.rv-row input[type=number]{padding:7px 9px}
.rv-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 20px;border-top:1px solid var(--line);background:var(--surface)}
.rv-foot .left{display:flex;gap:8px;flex-wrap:wrap}
.pending{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.vsum{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:10px;font-size:14.5px;color:var(--muted)}
.vsum b{color:var(--ink);font-weight:600}
table.af{width:100%;border-collapse:collapse;font-size:14px;margin-top:6px}
table.af th,table.af td{padding:6px 6px;border-bottom:1px solid var(--line);text-align:right;vertical-align:middle}
table.af th{background:var(--sunk);font-weight:700}
table.af input,table.af select{padding:5px 7px;font-size:14px}
table.af td.code{width:70px}table.af td.val{width:120px}table.af td.map{width:170px}
table.af tr.used td{background:color-mix(in srgb,var(--good-soft) 60%,transparent)}
details.afbox{margin-top:16px;border-top:2px solid var(--ink);padding-top:10px}
details.afbox summary{cursor:pointer;font-weight:700;font-size:16px}

/* PDF report (rendered off-screen, always light) */
#rpt-root{position:fixed;left:-20000px;top:0;direction:rtl;color-scheme:light}
.rp{width:794px;height:1123px;background:#fff;color:#16252B;font-family:var(--sans);font-size:12.5px;line-height:1.5;padding:38px 44px 26px;display:flex;flex-direction:column;box-sizing:border-box}
.rp-head{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid #16252B;padding-bottom:6px;margin-bottom:14px;height:34px;box-sizing:border-box}
.rp-head b{font-family:var(--serif);font-size:15px}.rp-head span{color:#56666C;font-size:11px}
.rp-body{flex:1;overflow:hidden;min-height:0}
.rp-foot{display:flex;justify-content:space-between;border-top:1px solid #CFD8D6;padding-top:6px;color:#56666C;font-size:10px;height:24px;box-sizing:border-box}
.r-blk{margin-bottom:14px}
.r-title h1{font-family:var(--serif);font-size:34px;margin:0;line-height:1.1}
.r-title p{margin:4px 0 0;font-size:14px}.r-muted{color:#56666C}
.r-kicker{color:#0D5C63;font-weight:700;font-size:13px}
.r-sum{display:grid;grid-template-columns:repeat(3,1fr);border:1.5px solid #16252B;border-radius:10px;overflow:hidden}
.r-sum>div{padding:10px 12px;border-inline-start:1px solid #CFD8D6;border-top:1px solid #CFD8D6}
.r-sum>div:nth-child(-n+3){border-top:0}.r-sum>div:nth-child(3n+1){border-inline-start:0}
.r-sum .k{color:#56666C;font-size:11px}.r-sum .v{font-family:var(--serif);font-size:20px;font-weight:700}
.r-sum .v.pos{color:#1E7A46}.r-sum .v.neg{color:#A3312A}
.r-h2{font-family:var(--serif);font-size:19px;margin:0 0 6px;padding-bottom:3px;border-bottom:1px solid #16252B}
.r-h3{font-size:14px;font-weight:700;margin:0 0 5px;color:#0D5C63}
table.r-t{width:100%;border-collapse:collapse;font-size:12px}
table.r-t th,table.r-t td{padding:4px 6px;border-bottom:1px solid #DDE4E2;text-align:right;vertical-align:top}
table.r-t th{background:#EEF2F1;font-weight:700}
table.r-t td.n{text-align:left;white-space:nowrap;font-variant-numeric:tabular-nums;direction:ltr}
table.r-t tr.s td{font-weight:700;border-top:1.5px solid #16252B;border-bottom:0}
table.r-t tr.g td{color:#1E7A46}table.r-t tr.b td{color:#A3312A}
.r-note{border:1px solid #E3C489;background:#FBF0DA;border-radius:8px;padding:7px 10px;font-size:12px}
.r-note.bad{border-color:#E2A39D;background:#F8E3E1}
.r-list{margin:0;padding-inline-start:18px}.r-list li{margin:2px 0}
.r-p{margin:0 0 6px;white-space:pre-wrap}
.r-legal{font-size:10.5px;color:#56666C}
@media print{aside.ledger,.rail,.nav,.drop,.btn{display:none !important}.layout{grid-template-columns:1fr}body{background:#fff}}
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <div>
      <h1>אשף הדוח השנתי</h1>
      <p>לשכירים ולעצמאים: מעלים את הטפסים, עונים רק על מה שרלוונטי, ומקבלים הערכת החזר או תשלום, דפי מילוי לטפסים 135 ו־1301 ומסלול הגשה לפי כללי רשות המסים.</p>
    </div>
    <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px"><div class="yearpill" id="yearPill">שנת מס 2025</div><div id="sync" class="sync" role="status">מתחבר…</div></div>
  </header>

  <ol class="rail" id="rail"></ol>

  <div class="layout">
    <main id="main" tabindex="-1"></main>
    <aside class="ledger" id="ledger" aria-label="סיכום ביניים"></aside>
  </div>
</div>

<dialog id="review" aria-labelledby="rvTitle"></dialog>
<script>
/* ============================================================
   נתוני מס לפי שנה — מקור: חוברות הניכויים של רשות המסים (2021–2026),
   2020 לפי עותק החוברת ו"כל זכות". ראו קישורי מקור בשלב התוצאה.
   ============================================================ */
const TAX = {
  brackets:{ // מדרגות חודשיות לשכיר
    2020:[[6330,.10],[9080,.14],[14580,.20],[20260,.31],[42160,.35],[Infinity,.47]],
    2021:[[6290,.10],[9030,.14],[14490,.20],[20140,.31],[41910,.35],[Infinity,.47]],
    2022:[[6450,.10],[9240,.14],[14840,.20],[20620,.31],[42910,.35],[Infinity,.47]],
    2023:[[6790,.10],[9730,.14],[15620,.20],[21710,.31],[45180,.35],[Infinity,.47]],
    2024:[[7010,.10],[10060,.14],[16150,.20],[22440,.31],[46690,.35],[Infinity,.47]],
    2025:[[7010,.10],[10060,.14],[16150,.20],[22440,.31],[46690,.35],[Infinity,.47]],
    2026:[[7010,.10],[10060,.14],[19000,.20],[25100,.31],[46690,.35],[Infinity,.47]]
  },
  point:{2020:2628,2021:2616,2022:2676,2023:2820,2024:2904,2025:2904,2026:2904},
  surtax:{2020:651600,2021:647640,2022:663240,2023:698280,2024:721560,2025:721560,2026:721560},
  donMin:{2020:190,2021:190,2022:190,2023:200,2024:207,2025:207,2026:207},

function linkInterest(amount,Y){ // s.159א: linkage + 4% a year from the end of the tax year until the refund is paid

const BIZ0={on:false,revenue:'',expenses:'',small:false,btlPaid:'',btlBenefits:'',pensionSelf:'',keren:'',disability:'',withheldInv:'',advances:''};
const bizOf=p=>Object.assign({},BIZ0,p.biz||{});
const selfCeil=Y=>Math.round(TAX.pensionCap[Y]/.07*2); // הכנסה מזכה לעצמאי (עמית מוטב) = פעמיים תקרת ההכנסה המזכה
function bizCalc(p,Y){
  const b=bizOf(p);if(!b.on)return null;

  const btlDed=n(b.btlPaid)*.52;                       // ס׳ 47א: 52% מדמי הביטוח הלאומי של עצמאי

async function pdfToTextAndImages(file,maxImages){
  const buf=await file.arrayBuffer();
  const pdf=await pdfjsLib.getDocument({data:buf,isEvalSupported:false}).promise;
  let text='';const pages=Math.min(pdf.numPages,6);
  for(let i=1;i<=pages;i++){const pg=await pdf.getPage(i);const tc=await pg.getTextContent();
    // rebuild lines by y position, with tolerance: a code and its amount are often printed a point or two apart
    const its=tc.items.filter(t=>t.str&&t.str.trim()).sort((a,b)=>b.transform[5]-a.transform[5]),rows=[];
    for(const it of its){const y=it.transform[5],r=rows.find(r=>Math.abs(r.y-y)<=3);if(r)r.items.push(it);else rows.push({y,items:[it]});}
    // left to right keeps digit runs (also digit-per-item, e.g. חילן) in reading order
    // join glyphs that touch (letter-per-item PDFs, e.g. חילן) and put a space only where there is a real gap
    rows.forEach(r=>{const s=r.items.sort((a,b)=>a.transform[4]-b.transform[4]);let line='';
      s.forEach((t,j)=>{if(j){const p=s[j-1],gap=t.transform[4]-(p.transform[4]+(p.width||0)),h=Math.abs(t.transform[3])||8;line+=gap>h*0.18?' ':'';}line+=t.str;});
      text+=line+'\n';});
    text+='\n--- עמוד '+i+' ---\n';}
  const imgs=[],previews=[];
  const scanned=text.replace(/\s|-|עמוד|\d/g,'').length<60;
  const nRender=Math.min(pdf.numPages,Math.max(3,scanned?maxImages:0));
  for(let i=1;i<=nRender;i++){const pg=await pdf.getPage(i);const vp=pg.getViewport({scale:2});
    const c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;
    await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;
    if(i<=3)previews.push(c.toDataURL('image/jpeg',.82));
    if(i<=maxImages)imgs.push(await new Promise(r=>c.toBlob(r,'image/png')));}
  return {text:normalizeDigits(text),imgs,previews};
}
function fixHebEncoding(t){ // Hebrew stored as Windows-1255 bytes read as Latin-1 ("úøåëùî") -> real Hebrew letters
  const lat=(t.match(/[\u00E0-\u00FA]/g)||[]).length,heb=(t.match(/[\u05D0-\u05EA]/g)||[]).length;
  return lat>20&&lat>heb*2?t.replace(/[\u00E0-\u00FA]/g,c=>String.fromCharCode(0x05D0+c.charCodeAt(0)-0xE0)):t;
}
function normalizeDigits(t){
  t=fixHebEncoding(t); // "3 0 0 , 0 0 0" (spaced digits, e.g. Hilan) -> "300,000"; leaves "158 300,000" (code + amount) apart
  return t.replace(/(?<![\d,.])\d(?![\d,.])(?:[ \u00A0][\d,.](?![\d,.])){2,}/g,m=>m.replace(/[ \u00A0]/g,'')).replace(/(\d)[ \u00A0]?,[ \u00A0]+(\d{3})(?![\d])/g,'$1,$2').replace(/[\u200e\u200f]/g,'');
}

Give an evidence string and a field_confidence for EVERY non-null field. Use "low" when the value was hard to read, could belong to a different line (e.g. employer vs employee deposit), or was computed by adding numbers.
${text?'\nDocument text (extracted from PDF; Hebrew may appear in visual order, digits may be split):\n"""\n'+text.slice(0,40000)+'\n"""':'\nThe document is provided as image(s).'}`;

async function parseFile(doc,file){
  try{
    const sample=await getSample();
    let text='',imgs=[];let limits=null;
    if(sample)limits=await sample.limits().catch(()=>null);
    const maxImg=limits?.images?.maxCount||0;
    if(file.type==='application/pdf'||/\.pdf$/i.test(file.name)){
      if(!window.pdfjsLib)throw{code:'nopdf'};
      let previews;({text,imgs,previews}=await pdfToTextAndImages(file,maxImg||3));PREVIEW.set(doc.id,previews);
    }else if(file.type.startsWith('image/')){imgs=[file];PREVIEW.set(doc.id,[URL.createObjectURL(file)]);}

  d.allFields.forEach(r=>{const c=normCode(r.code);if(c!==r.code)r.code=c;
    if(!r.map&&autoMap(d.type,r.code,r.label))r.map=autoMap(d.type,r.code,r.label);

  const fields=(FIELDS[d.type]||[]).map(([k,l,h])=>numF(`docs.${idx}.fields.${k}`,l,h)).join('');

    ${FILES.has(d.id)&&d.status!=='reading'?`<button class="btn ghost small" data-reparse="${idx}">פענח שוב</button>`:''}
    <button class="btn ghost small" data-del="${idx}" aria-label="הסרת המסמך">הסר</button></div></div>
    ${d.err?`<div class="note ${d.status==='error'?'bad':'warn'}">${esc(d.err)}</div>`:''}

    ${d.status!=='reading'?`<div class="grid">
      ${sel(`docs.${idx}.type`,'סוג המסמך',DOC_TYPES)}

function suggestions(R){
  const t=[],Y=S.year;
  for(const x of R.r){const p=S.persons[x.i],a=x.a,nm=S.married?` (${esc(p.name||personLabel(x.i))})`:'';
    if(x.P.length>2)t.push(`עדכנו את טופס 101 אצל המעסיק עם הנקודות שזוהו כאן${nm}, כדי שיינתנו כבר בתלוש ולא רק בהחזר.`);
    if(a.n106>=2)t.push(`בשנה עם יותר ממעסיק אחד, עשו תיאום מס מקוון כבר באמצע השנה${nm}.`);
    if(x.pensionBase<TAX.pensionCap[Y]&&x.income>0)t.push(`ניצלתם ${nf.format(x.pensionBase)} ₪ מתוך תקרת הפקדות של ${nf.format(TAX.pensionCap[Y])} ₪ לזיכוי 35% על פנסיה${nm}. השלמה עד התקרה מקטינה מס, בכפוף לבדיקה מול ההפקדות בתלוש.`);
    if(!x.don)t.push(`תרומה למוסד עם אישור סעיף 46 מחזירה 35% מהסכום כזיכוי, מעל ${TAX.donMin[Y]} ₪ בשנה${nm}.`);
  }
  if(S.year<2026)t.push('בדקו גם שנים קודמות: אפשר לבקש החזר עד שש שנים אחורה, וכל שנה בבקשה נפרדת.');
  return [...new Set(t)];
}

  const prompt=`You are an Israeli income-tax advisor helping a salaried employee prepare a refund request (Form 135) or annual return. Answer in Hebrew, plainly, in short paragraphs without markdown headers.

Data computed by the wizard (JSON):
${aiContext()}

${question?'The user asks: '+question:'Analyse the result: is it plausible, what might be missing or wrong, and what are the 3-6 most valuable actions?'}`;
  try{const{text}=await sample(prompt,{signal:aiCtl.signal,cache:false,onText:({text})=>{out.textContent=text;}});window._aiLast=text;}

  finally{$('#aiStop')?.classList.add('hidden');}
}

  const val=(x,f)=>x?Math.round(f(x)||0):0;
  const sec=[],add=(title,rows,note)=>{rows=rows.filter(r=>r.desc&&(r.keep||r.vA||r.vB));if(rows.length)sec.push({title,rows,note});};
  const LN=(line,key)=>lineOf(kind,Y,key)||line;
  const r=(line,desc,cA,cB,f,keep)=>hasCode(kind,Y,cA)?({line:LN(line,cA),desc,cA,cB,vA:val(A,f),vB:val(Bp,f),keep}):({});
  const t=(line,desc,cA,cB,f,key)=>{if(!hasCode(kind,Y,cA))return{};const a=f(A,0),b=Bp?f(Bp,1):'';return{line:LN(line,key||cA),desc,cA,cB,vA:a,vB:b,text:true,keep:!!(a||b)};};
  const lifeOf=x=>x.a.lifeIns+n(S.persons[x.i].lifeIns)+x.a.lifeDocs;
  const penEmpOf=x=>x.a.pensionEmp+n(S.persons[x.i].privatePension)+x.a.pensionDocs;
  const inc=[];
  if(kind==='1301'){
    inc.push(r('1','מיגיעה אישית מעסק או משלח יד (לפני הניכויים שבחלק יב)','150','170',x=>x.B?x.B.profit:0));
    inc.push(r('2א','תקבולים מביטוח לאומי בגין הכנסה כעצמאי','250','270',x=>x.B?x.B.benefits:0));
  }
  inc.push(r(kind==='1301'?'2ב':'2','תקבולים מביטוח לאומי כשכיר שאינם כלולים בטופס 106','194','196',x=>x.a.btlGross));
  inc.push(r('3','משכורת ושכר עבודה (מטופסי 106)','158','172',x=>x.a.salary,true));
  add(kind==='1301'?'ג. הכנסות מיגיעה אישית':'הכנסות',inc);
  if(kind==='1301')add('ז. נתונים נוספים',[r('36','סך מחזור מעסק או משלח יד, ללא מע״מ','238','239',x=>x.B?x.B.rev:0)]);
  const ded=[];
  if(kind==='1301'){
    ded.push(r('49','ביטוח מפני אובדן כושר עבודה ששולם בשל הכנסה כעצמאי','112','113',x=>x.B?n(x.B.b.disability):0));
    ded.push(r('51','קרן השתלמות לעצמאים (הסכום ששולם)','136','137',x=>x.B?n(x.B.b.keren):0));
  }
  ded.push(r('52','משכורת שבשלה שילם המעביד לקרן השתלמות','218','219',x=>x.a.keren));
  if(kind==='1301')ded.push(r('53','קופת גמל לקצבה כעמית עצמאי: החלק לניכוי (ס׳ 47)','135','180',x=>x.B?x.B.penDed:0));
  ded.push(r('58','הכנסה מבוטחת','244','245',x=>x.a.insured));
  ded.push(r('59','הפקדות המעביד לקופת גמל לקצבה','248','249',x=>x.a.pensionEr));
  if(Y===2024||Y===2025)ded.push(r('60','השתתפות זמנית: הפחתת דמי הבראה (לידיעה)','011','012',x=>x.a.havraa));
  add(kind==='1301'?'יב. ניכויים אישיים':'ניכויים ונתוני הפרשות',ded);
  // credit points
  const KB=bandDefs(Y).map(b=>b[0]==='נולד'?'נולד/ה בשנת המס':'מלאו '+b[0]);
  const kidTxt=x=>{const c=kidBands(x.i);return c.some(Boolean)?KB.map((l,j)=>c[j]?`${l}: ${c[j]}`:'').filter(Boolean).join(', '):'';};
  const pts=[];
  const famOf=x=>S.persons[x.i].family;
  pts.push(t('64','ילדים — שורה (1): בחזקתי / מקבל/ת קצבת ילדים','260','262',x=>famOf(x)==='apart_noncust'?'':kidTxt(x),'kids'));
  pts.push(t('64','ילדים — שורה (2): ילדיי שאינם בחזקתי','190','291',x=>famOf(x)==='apart_noncust'?kidTxt(x):'','kids'));
  pts.push(t('64','ילדים — שורה (3): הורה יחיד, אין הורה שני רשום או שנפטר (בנוסף לשורה 1)','022','',x=>famOf(x)==='sole'?kidTxt(x):'','kids'));
  pts.push(t('65','הורה במשפחה חד־הורית שהילדים בחזקתו','026','',x=>famOf(x)==='single'||famOf(x)==='sole'?'כן':''));
  pts.push(t('66','השתתפות בכלכלת ילדים שאינם סמוכים על שולחני','028','029',x=>famOf(x)==='apart_noncust'?'כן':''));
  pts.push(t('67','תשלום מזונות לבן/בת זוג לשעבר (נשוי/אה בשנית)','153','',x=>famOf(x)==='alimony'?'כן':''));
  pts.push(t('68','מספר ילדים עם מוגבלות שבגינם נדרשות נקודות','023','131',x=>n(S.persons[x.i].disabledChildren)||''));
  pts.push(t('69','עולה חדש: תאריך עלייה','273','274',x=>{const d=S.persons[x.i].oleh.date;return d&&olehPts(d,Y)?d.split('-').reverse().join('/'):'';}));
  pts.push(t('71','חייל/ת משוחרר/ת: תאריך שחרור (חודש/שנה)','224','324',x=>{const d=S.persons[x.i].discharge;return d.date&&soldierPts(d,Y)?`${d.date.split('-').reverse().join('/')}${d.full?', שירות מלא':''}`:'';}));
  pts.push(t('72','סיום תואר / לימודי מקצוע: שנת סיום (וקוד מטופס 119)','181','182',x=>{const g=S.persons[x.i].degree;return degreePts(g,Y)?`${g.type==='ma'?'תואר שני':g.type==='voc'?'לימודי מקצוע':'תואר ראשון'}, ${g.year}`:'';}));
  add('יג. נקודות זיכוי',pts,'הערכים כאן הם לסימון בטופס. נקודות הבסיס (תושב/ת, אישה) ניתנות אוטומטית.');
  const cr=[];
  cr.push(r('73','ביטוח חיים','036','081',lifeOf));
  cr.push(r('75','לקצבה כעמית שכיר','045','086',penEmpOf));
  if(kind==='1301')cr.push(r('76','לקצבה כעמית עצמאי: החלק לזיכוי (ס׳ 45א)','268','269',x=>x.B?x.B.penCreditBase:0));
  cr.push(r('78א','תרומות למוסדות ציבור בישראל (ס׳ 46)','037','237',x=>x.don));
  cr.push(t('82','תושב/ת יישוב מזכה: שיעור ותקרה','','',x=>{const y=S.persons[x.i].yishuv;return y.on&&n(y.rate)?`${y.rate}% עד ${nf.format(n(y.ceiling))} ₪`:'';}));
  cr.push(t('77','החזקת בן משפחה במוסד','132','232',x=>S.persons[x.i].ev.institution?'יש לצרף טופס 116א':''));
  add('יד. זיכויים אישיים',cr);
  const sum=(f)=>R.r.reduce((a,x)=>a+Math.round(f(x)||0),0);
  const tot=[];
  if(kind==='1301')tot.push({line:lineOf(kind,Y,'294')||'83',desc:'סך המחזור מכל העסקים, ללא מע״מ',cA:'294',cB:'',vA:sum(x=>x.B?x.B.rev:0),vB:''});
  tot.push({line:lineOf(kind,Y,'042')||'84',desc:'מס הכנסה שנוכה במקור ממשכורת, משכר עבודה ומקצבאות (סה״כ)',cA:'042',cB:'',vA:sum(x=>x.a.withheld+x.a.btlTax),vB:'',keep:true});
  if(kind==='1301')tot.push({line:lineOf(kind,Y,'040')||'87',desc:'סכומים שנוכו במקור מהכנסות אחרות (סה״כ, מצ״ב אישורים)',cA:'040',cB:'',vA:sum(x=>x.B?x.B.withheldInv:0),vB:''});
  add('טו. ניכויים במקור',tot);
  return{kind,Y,two,sec,R};
}
function formTable(sec,two,pdf){
  const T=pdf?'r-t':'calc',N=pdf?'n':'n';
  const cell=(v,text)=>v===''||v===0||v===undefined?'':text?esc(v):(pdf?rm(v):money(v));
  return `<table class="${T}"><tr><th>שורה</th><th>תיאור</th><th>שדה</th><th>${two?'בן הזוג הרשום':'סכום / ערך'}</th>${two?'<th>שדה</th><th>בן/בת הזוג</th>':''}</tr>
   ${sec.rows.map(x=>{const a=cell(x.vA,x.text),b=cell(x.vB,x.text);return `<tr><td>${x.line}</td><td>${x.desc}</td><td class="${N}"><b>${a||x.keep?x.cA:''}</b></td><td class="${x.text?'':N}">${a}</td>${two?`<td class="${N}"><b>${b?x.cB:''}</b></td><td class="${x.text?'':N}">${b}</td>`:''}</tr>`;}).join('')}</table>`;
}
function formNotes(m){
  const ob=obligations(m.R),Y=m.Y,anyBiz=m.R.r.some(x=>x.B);
  const out=[];
  if(m.kind==='135'&&ob.length)out.push(`<b>שימו לב:</b> זוהו סימנים לחובת דוח מלא, ולכן טופס 135 כנראה אינו המסלול הנכון: ${ob.join(' ')}`);
  if(m.kind==='1301'&&anyBiz)out.push('לכל עסק יש לצרף נספח א׳ (טופס 1320). מקדמות ששולמו אינן נרשמות בטופס; הן נזקפות בשומה לפי חשבון המס.');
  if(m.kind==='1301'&&anyBiz)out.push('החלוקה של הפקדות הפנסיה כעצמאי בין החלק לניכוי (135/180) לחלק לזיכוי (268/269) חושבה באשף. ודאו אותה לפי הוראות המילוי של הטופס או עם מייצג.');
  out.push('פרטי חשבון הבנק להחזר: שדות 277 ו־278. יש לחתום על הטופס (שני בני הזוג, אם נשואים) ולצרף את המסמכים.');
  out.push(`קודי השדות ומספרי השורות לפי טופס ${m.kind} הרשמי של רשות המסים לשנת המס ${Math.min(2025,Math.max(2020,Y))}.`);
  out.push('ממלאים ידנית: כתובת, טלפון, קוד לימודים מטופס 119, מספר חודשי שירות וחתימות.');
  return out;
}
function formBlocks(kind){
  const m=formModel(kind),Y=m.Y,nm=i=>esc(S.persons[i].name||personLabel(i));const B=[];
  B.push(`<div class="r-title"><div class="r-kicker">דף מילוי, לא הטופס הרשמי</div><h1>טופס&nbsp;${kind}, שנת&nbsp;מס&nbsp;${Y}</h1>
    <p>${kind==='135'?'דוח שנתי מקוצר / בקשה להחזר מס':'דין וחשבון שנתי ליחיד'}</p>
    <p class="r-muted">הערכים להעתקה לטופס הרשמי או לשירות המקוון של רשות המסים. הופק ב־${TODAY.toLocaleDateString('he-IL')}.</p></div>`);
  B.push(`<table class="r-t"><tr><th>בן הזוג הרשום</th><td>${nm(0)} ${esc(S.persons[0].lastName||'')}</td><th>מספר זהות</th><td class="n">${esc(S.persons[0].idNum||'__________')}</td></tr>
    ${S.married?`<tr><th>בן/בת הזוג</th><td>${nm(1)} ${esc(S.persons[1].lastName||'')}</td><th>מספר זהות</th><td class="n">${esc(S.persons[1].idNum||'__________')}</td></tr>`:''}
    ${S.bank?.account?`<tr><th>חשבון בנק (277/278)</th><td colspan="3" class="n">${esc(S.bank.code||'')}-${esc(S.bank.branch||'')}-${esc(S.bank.account)}</td></tr>`:''}
    <tr><th>מצב משפחתי</th><td>${S.married?'נשוי/אה וחי/ה ביחד':'לא נשוי/אה'}</td><th>הדוח הוא על</th><td>${S.married?'הכנסותיי והכנסות בן/בת זוגי':'הכנסותיי בלבד'}</td></tr>
    ${m.R.tot>0&&!obligations(m.R).length?`<tr><th colspan="2">סימון בחלק א</th><td colspan="2">אני מגיש/ה דוח למרות שאיני חייב/ת: בקשה להחזר מס</td></tr>`:''}</table>`);
  for(const sec of m.sec)B.push(`<div class="r-h3">${sec.title}</div>${formTable(sec,m.two,true)}${sec.note?`<p class="r-legal" style="margin-top:3px">${sec.note}</p>`:''}`);
  const x=Math.abs(m.R.tot)>=1?linkInterest(m.R.tot,Y):null;
  B.push(`<div class="r-sum"><div><div class="k">${m.R.tot>=0?'החזר משוער':'חוב משוער'} לפי האשף</div><div class="v ${m.R.tot>=0?'pos':'neg'}">${rm(Math.abs(m.R.tot))}</div></div>
    <div><div class="k">כולל הצמדה וריבית${x?' עד '+x.pay.toLocaleDateString('he-IL'):''}</div><div class="v">${x?rm(Math.abs(x.total)):'—'}</div></div>
    <div><div class="k">מועד אחרון</div><div class="v" style="font-size:16px">${kind==='135'?`31.12.${Y+6}`:'לפי לוח ההגשה של השנה'}</div></div></div>`);
  B.push(`<h2 class="r-h2">הערות למילוי</h2><ul class="r-list">${formNotes(m).map(t=>`<li>${t}</li>`).join('')}</ul>`);
  const tr=triggers(m.R);const always=['טופסי 106 מכל המעסיקים','צילום תעודת זהות כולל ספח','אישור ניהול חשבון בנק'];
  B.push(`<h2 class="r-h2">מסמכים לצרף</h2><ul class="r-list">${[...new Set([...always,...tr.flatMap(t=>t.docs)])].map(d=>`<li>${d}</li>`).join('')}</ul>`);
  B.push(`<p class="r-legal">דף העזר הופק אוטומטית. הוא אינו הטופס הרשמי, ואין להגיש אותו כמות שהוא. החישוב המחייב הוא של רשות המסים.</p>`);
  return B;
}
function formsBlock(R){
  const ob=obligations(R),rec=ob.length?'1301':'135';
  const prev=k=>{const m=formModel(k);return m.sec.map(sec=>`<h4 style="margin:12px 0 4px">${sec.title}</h4><div class="scroll-x">${formTable(sec,m.two,false)}</div>`).join('')+`<ul class="plain" style="margin-top:10px">${formNotes(m).map(t=>`<li>${t}</li>`).join('')}</ul>`;};
  return `<div class="block"><h3>טפסי דיווח לרשות המסים</h3>
   <p class="hint">דף מילוי עם כל קודי השדות והסכומים, להעתקה לטופס הרשמי או לשירות המקוון. המסלול המתאים לפי הנתונים: <b>טופס ${rec}</b>${ob.length?' (יש סימנים לחובת דוח מלא)':''}.</p>
   <div style="display:flex;gap:10px;flex-wrap:wrap">
     <button class="btn ${rec==='135'?'':'ghost'}" data-official="135">טופס 135 רשמי ממולא</button>
     <button class="btn ${rec==='1301'?'':'ghost'}" data-official="1301">טופס 1301 רשמי ממולא</button></div>
   <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:8px">
     <button class="btn ghost small" data-form="135">דף מילוי 135</button>
     <button class="btn ghost small" data-form="1301">דף מילוי 1301</button></div>
   ${S.year>2025?`<p class="hint" style="margin-top:8px">הטופס הרשמי של ${S.year} עוד לא פורסם. הטופס ימולא על גבי הטופס של 2025, לבדיקה בלבד.</p>`:''}
   <p class="hint" style="margin-top:8px">הטופס הרשמי של רשות המסים לשנת ${Math.min(2025,Math.max(2020,S.year))}, עם הסכומים, ספירת הילדים לפי עמודות הגיל של אותה שנה והסימונים בחלק א׳. הטופס כולל גם שמות, מספרי זהות ופרטי בנק שהזנתם בשלב 1. נשאר למלא ביד כתובת, טלפון וחתימות.</p>
   <details style="margin-top:12px"><summary style="cursor:pointer;font-weight:700">תצוגה מקדימה: טופס 135</summary>${prev('135')}</details>
   <details style="margin-top:8px"><summary style="cursor:pointer;font-weight:700">תצוגה מקדימה: טופס 1301</summary>${prev('1301')}</details>
   <p class="hint" style="margin-top:10px">הגשה: <a href="https://www.gov.il/he/service/itc135" target="_blank" rel="noopener">טופס 135 ובקשת החזר מס</a>, <a href="https://www.gov.il/he/service/reporting-and-payment-2025-annual-tax-report-for-individuals" target="_blank" rel="noopener">דוח שנתי 1301 לשנת 2025</a>.</p></div>`;
}

/* ---- official form: write the values onto the ITA PDF of that year ---- */
async function makeOfficialPdf(btn,kind){
  const Y=S.year,Yf=Math.min(2025,Math.max(2020,Y)),key=formKey(kind,Yf),P=FORM_POS[key];
  if(!P||!FORM_URLS[key]){alert(`הטופס הרשמי לשנת ${Y} לא זמין כאן. אפשר להפיק דף מילוי.`);return;}
  const label=btn.textContent;btn.disabled=true;btn.textContent='ממלא את הטופס…';
  try{
    await loadScript(PDFLIB_SRC);
    const res=await fetch(FORM_URLS[key]);if(!res.ok)throw new Error('fetch');
    const L=window.PDFLib,doc=await L.PDFDocument.load(await res.arrayBuffer());
    const font=await doc.embedFont(L.StandardFonts.Helvetica),bold=await doc.embedFont(L.StandardFonts.HelveticaBold);
    const pages=doc.getPages(),ink=L.rgb(.05,.2,.6);
    const put=(code,v,size=9)=>{const c=P.c[code];if(!c||v===''||v===null||v===undefined||v===0)return;const s=String(typeof v==='number'?Math.round(v):v);
      pages[c[0]].drawText(s,{x:c[1]-4-font.widthOfTextAtSize(s,size),y:c[2],size,font,color:ink});};
    const xCode=code=>{const c=P.c[code];if(c)pages[c[0]].drawText('X',{x:c[1]-12,y:c[2],size:9,font:bold,color:ink});};
    const chk=k=>{const c=P.x[k];if(c)pages[c[0]].drawText('X',{x:c[1]-2.7,y:c[2],size:7.5,font:bold,color:ink});};
    const m=formModel(kind),R=m.R;
    for(const sec of m.sec)for(const r of sec.rows){if(r.text)continue;
      if(typeof r.vA==='number')put(r.cA,r.vA);if(r.cB&&typeof r.vB==='number')put(r.cB,r.vB);}
    // personal status
    if(S.married){chk('married');chk('couple');}
    if(R.tot>0&&!obligations(R).length)chk('refund');
    xCode('020');
    // personal details
    const PP=FORM_PERS[key]||{};let heb=null;
    const names=persons().some(i=>S.persons[i].name||S.persons[i].lastName);
    if(names&&HEB_FONT_URL){try{await loadScript(FONTKIT_SRC);doc.registerFontkit(window.fontkit);
      heb=await doc.embedFont(await (await fetch(HEB_FONT_URL)).arrayBuffer(),{subset:true});}catch(e){heb=null;}}
    const center=(f,s,ent,size=10)=>{if(!ent||!s)return;pages[ent.p].drawText(s,{x:ent.cx-f.widthOfTextAtSize(s,size)/2,y:ent.y,size,font:f,color:ink});};
    persons().forEach(i=>{const p=S.persons[i],E=PP[i===0?'reg':'sp'];if(!E)return;
      if(heb){center(heb,visualHeb(p.name),E.first);center(heb,visualHeb(p.lastName),E.last);}
      const id=String(p.idNum||'').replace(/\D/g,'');
      if(id&&E.id){const d=id.padStart(9,'0');
        if(E.id.cells){const [c0,st]=E.id.cells;d.split('').forEach((ch,j)=>pages[E.id.p].drawText(ch,{x:c0+st*j-font.widthOfTextAtSize(ch,10)/2,y:E.id.y,size:10,font,color:ink}));}
        else center(font,d.split('').join(' '),E.id);}
    });
    const id0=String(S.persons[0].idNum||'').replace(/\D/g,'');
    if(id0&&PP.hdr)pages[PP.hdr.p].drawText(id0.padStart(9,'0'),{x:PP.hdr.x-font.widthOfTextAtSize(id0.padStart(9,'0'),9),y:PP.hdr.y,size:9,font,color:ink});

async function makePdf(btn,blocks,headTitle,filenameIn){

  try{
    await loadScript('vendor/html2canvas.min.js');
    await loadScript('vendor/jspdf.umd.min.js');
    try{await document.fonts.ready;}catch(e){}
    root=document.createElement('div');root.id='rpt-root';root.setAttribute('aria-hidden','true');document.body.appendChild(root);
    const pages=[];
    const newPage=()=>{const el=document.createElement('div');el.className='rp';
      el.innerHTML=`<div class="rp-head"><b>${headTitle}</b><span>${esc(persons().map(i=>S.persons[i].name).filter(Boolean).join(', '))}</span></div><div class="rp-body"></div><div class="rp-foot"><span>הערכה בלבד, אינה ייעוץ מס</span><span class="pg"></span></div>`;
      root.appendChild(el);const p={el,body:el.querySelector('.rp-body'),pg:el.querySelector('.pg')};pages.push(p);return p;};
    let page=newPage();
    for(const html of blocks){const blk=document.createElement('div');blk.className='r-blk';blk.innerHTML=html;page.body.appendChild(blk);
      if(page.body.scrollHeight>page.body.clientHeight+1&&page.body.children.length>1){blk.remove();page=newPage();page.body.appendChild(blk);}}
    pages.forEach((p,i)=>p.pg.textContent=`עמוד ${i+1} מתוך ${pages.length}`);
    const pdf=new window.jspdf.jsPDF({unit:'mm',format:'a4',compress:true});
    for(let i=0;i<pages.length;i++){btn.textContent=`מכין PDF… ${i+1}/${pages.length}`;
      const c=await window.html2canvas(pages[i].el,{scale:2,backgroundColor:'#ffffff',logging:false});
      if(i)pdf.addPage();pdf.addImage(c.toDataURL('image/jpeg',.9),'JPEG',0,0,210,297);}
    pdf.setProperties({title:`דוח שנתי ${S.year}`});
    const blob=pdf.output('blob');const filename=filenameIn||`tax-report-${S.year}.pdf`;
    let dl=null;try{dl=window.claude?.use?await window.claude.use('downloads'):null;}catch(e){}

    if(x.lifeCredit)md+=`| זיכוי ביטוח חיים | −${nf.format(Math.round(x.lifeCredit))} |\n`;

}

  if(t.dataset.review!==undefined){openReview(Number(t.dataset.review));return;}
  if(t.dataset.afadd!==undefined){const d=S.docs[RV];d.allFields=d.allFields||[];d.allFields.push({code:'',label:'',value:'',map:''});save();const sc=$('#review .rv-f').scrollTop;renderReview();$('#review .rv-f').scrollTop=sc;$('#review .afbox').open=true;const ins=document.querySelectorAll('#review [data-afk="code"]');ins[ins.length-1]?.focus();return;}
  if(t.dataset.afdel!==undefined){const d=S.docs[RV];d.allFields.splice(Number(t.dataset.afdel),1);syncFromAll(d);save();const sc=$('#review .rv-f').scrollTop;renderReview();$('#review .rv-f').scrollTop=sc;renderLedger();return;}
  if(t.dataset.rvclose!==undefined){closeReview();return;}
  if(t.dataset.rvmove!==undefined){ // a form of another tax year: move it into that year's record and keep reviewing there
    (async()=>{const y=Number(t.dataset.rvmove),d=S.docs.splice(RV,1)[0];RV=-1;$('#review').close();
      S.updatedAt=Date.now();try{localStorage.setItem(LKEY(S.year),JSON.stringify(serial()));}catch(e){}
      if(SYNC.db){try{await yearDoc(S.year).set({state:serial(),updatedAt:S.updatedAt,device:DEVICE});}catch(e){}}
      await changeYear(y);S.docs.push(d);save();render();openReview(S.docs.length-1);})();return;}
  if(t.dataset.rvok!==undefined){approveCurrent();return;}
  if(t.dataset.rvall!==undefined){const d=S.docs[RV];d.checked=d.checked||{};reviewRows(d).forEach(([k])=>d.checked[k]=true);save();renderReview();return;}
  if(t.dataset.rvskip!==undefined){const pend=pendingDocs().filter(x=>x!==S.docs[RV]);const cur=pendingDocs().indexOf(S.docs[RV]);const nx=pendingDocs()[cur+1]||pend[0];if(nx){RV=S.docs.indexOf(nx);renderReview();}return;}
  if(t.dataset.rvdel!==undefined){if(confirm('להסיר את המסמך?')){S.docs.splice(RV,1);save();const nx=pendingDocs()[0];if(nx){RV=S.docs.indexOf(nx);renderReview();}else closeReview();}return;}
  if(t.dataset.add){S.docs.push({id:Math.random().toString(36).slice(2),fileName:'',status:'manual',owner:0,type:t.dataset.add,fields:{}});save();render();return;}
  if(t.dataset.del!==undefined){S.docs.splice(Number(t.dataset.del),1);save();render();return;}
  if(t.dataset.reparse!==undefined){const d=S.docs[Number(t.dataset.reparse)];d.status='reading';d.err='';d.verified=false;d.checked={};render();parseFile(d,FILES.get(d.id)).then(()=>{if(!d.orig)d.orig={...d.fields};save();render();maybeOpenReview();});return;}
  if(t.dataset.addkid!==undefined){S.children.push({birthYear:'',mine:'both'});save();render();return;}
  if(t.dataset.delkid!==undefined){S.children.splice(Number(t.dataset.delkid),1);save();render();return;}
  if(t.dataset.ledger!==undefined){$('#ledger').classList.toggle('open');renderLedger();return;}
  if(t.dataset.reset!==undefined){if(confirm('למחוק את נתוני שנת המס הזו במכשיר הזה ולהתחיל מחדש?')){const y=S.year,st=S.step;S=structuredClone(DEFAULT);S.year=y;S.step=0;window._aiLast='';save();render();}return;}
  if(t.id==='aiAnalyze'){ask('');return;}
  if(t.id==='aiAsk'){const q=$('#aiQ').value.trim();if(q)ask(q);return;}
  if(t.id==='aiStop'){aiCtl?.abort();return;}
  if(t.id==='dl'){exportSummary();return;}
  if(t.id==='pdf'){makePdf(t);return;}
  if(t.dataset.official){makeOfficialPdf(t,t.dataset.official);return;}
  if(t.dataset.form){const k=t.dataset.form;makePdf(t,formBlocks(k),`דף מילוי לטופס\u00a0${k}, שנת\u00a0מס\u00a0${S.year}`,`form-${k}-${S.year}.pdf`);return;}
});
document.getElementById('review').addEventListener('cancel',e=>{e.preventDefault();closeReview();});
document.addEventListener('keydown',e=>{if(e.target.id==='drop'&&(e.key==='Enter'||e.key===' ')){e.preventDefault();$('#file').click();}});
function onField(e){
  const el=e.target;
  if(el.dataset&&el.dataset.af!==undefined){const d=S.docs[RV];const r=d.allFields[Number(el.dataset.af)],k=el.dataset.afk;
    r[k]=k==='value'?(el.value===''?'':n(el.value)):k==='code'?el.value.replace(/\D/g,'').slice(0,3):el.value;
    if(k==='code'&&e.type==='change'&&!r.map){r.code=normCode(r.code);r.map=autoMap(d.type,r.code,r.label);}
    syncFromAll(d);if(k==='value'&&r.map){d.checked=d.checked||{};d.checked[r.map]=true;}
    save();renderLedger();if(e.type==='change')rerenderReview();else refreshReviewChrome();return;}
  if(el.dataset&&el.dataset.check!==undefined){const d=S.docs[RV];d.checked=d.checked||{};d.checked[el.dataset.check]=el.checked;save();refreshReviewChrome();return;}
  if(!el.dataset||!el.dataset.path)return;
  let v;
  if(el.type==='checkbox')v=el.checked;
  else if(el.type==='radio'){if(!el.checked)return;v=el.dataset.bool?el.dataset.bool==='true':el.value;}
  else if(el.tagName==='SELECT'){v=el.value==='true'?true:el.value==='false'?false:(/^\d+$/.test(el.value)&&(el.dataset.path==='year'||/\.owner$/.test(el.dataset.path))?Number(el.value):el.value);}
  else v=el.value;
  if(el.dataset.path==='year'){changeYear(Number(v));return;}
  if(/^children\.\d+\.birthYear$/.test(el.dataset.path)&&e.type==='change'&&n(v)>0&&n(v)<100){ // an age was typed: turn it into a birth year for this tax year
    v=String(S.year-n(v));const c=getPath(S,el.dataset.path.replace(/\.birthYear$/,''));c.fromAge=true;}
  if(/^children\.\d+\.birthYear$/.test(el.dataset.path)&&e.type==='change'&&n(v)>=1900){const c=getPath(S,el.dataset.path.replace(/\.birthYear$/,''));if(String(c.birthYear)!==String(v)&&n(v)>=1900&&!(n(el.value)<100))c.fromAge=false;}
  setPath(S,el.dataset.path,v);
  const m=el.dataset.path.match(/^persons\.(\d)\.yishuv\.combo$/);
  if(m&&v&&v!=='manual'){const[r,c]=v.split('|').map(Number);S.persons[m[1]].yishuv.rate=r;S.persons[m[1]].yishuv.ceiling=c;}
  const g=el.dataset.path.match(/^persons\.(\d)\.gender$/);
  if(g){S.persons[g[1]].side=v==='f'?'mother':'father';}
  save();
  if(el.closest&&el.closest('#review')){
    const d=S.docs[RV];if(el.dataset.rv&&el.dataset.rv!=='year'){d.checked=d.checked||{};d.checked[el.dataset.rv]=true;}
    if(el.dataset.path.endsWith('.taxYear'))d.taxYear=n(v)||null;
    if(el.dataset.path.endsWith('.type')&&d.allFields){d.allFields.forEach(r=>{r.map=autoMap(d.type,r.code,r.label);});syncFromAll(d);}
    if(el.dataset.rv&&el.dataset.rv!=='year'&&e.type==='change'){d.fields[el.dataset.rv]=v===''?'':n(v);}
    if(el.dataset.re!==undefined&&e.type==='change'){rerenderReview();render();}else refreshReviewChrome();
    renderLedger();return;
  }
  if(el.dataset.re!==undefined&&e.type==='change')render();else renderLedger();
}
document.addEventListener('input',onField);
document.addEventListener('change',e=>{if(e.target.id==='file'){handleFiles([...e.target.files]);e.target.value='';return;}onField(e);});
document.addEventListener('dragover',e=>{const d=e.target.closest?.('#drop');if(d){e.preventDefault();d.classList.add('over');}});
document.addEventListener('dragleave',e=>{const d=e.target.closest?.('#drop');if(d)d.classList.remove('over');});
document.addEventListener('drop',e=>{const d=e.target.closest?.('#drop');if(d){e.preventDefault();d.classList.remove('over');handleFiles([...e.dataTransfer.files]);}});

render();
initSync();
</script>
